<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ottoman · Catálogo de ojos</title>
<style>
  body { margin: 0; background: #0a0f1c; color: #e7ecf6; font: 14px "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 14px 16px 4px; }
  p { margin: 0 16px 12px; color: #8b97b3; }
  .grilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px 16px; }
  figure { margin: 0; background: #121a2c; border: 1px solid #24304d; border-radius: 12px; overflow: hidden; }
  figcaption { padding: 6px 10px; font-size: 12.5px; color: #8b97b3; }
  iframe { display: block; width: 100%; aspect-ratio: 640 / 250; border: 0; }
  canvas { display: block; width: 100%; height: auto; }
  body.uno { overflow: hidden; }
</style>
</head>
<body>
<script src="/web/ojos.js"></script>
<script>
  const d = new URLSearchParams(location.search).get("d");
  if (d) {
    document.body.className = "uno";
    const c = document.createElement("canvas"); c.width = 640; c.height = 250; document.body.appendChild(c);
    Ojos.iniciar(c); Ojos.mostrar(d);
  } else {
    document.body.insertAdjacentHTML("beforeend",
      "<h1>Catálogo de ojos de Ottoman</h1><p>Los nueve diseños, más el parpadeo que se usa para pasar de uno a otro.</p><div class='grilla'>" +
      Ojos.disenos.map((x) => `<figure><iframe src="?d=${x}" title="${Ojos.nombre(x)}"></iframe><figcaption>${Ojos.nombre(x)}</figcaption></figure>`).join("") +
      "</div>");
  }
</script>
</body>
</html>
